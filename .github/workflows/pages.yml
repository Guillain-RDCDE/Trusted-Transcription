name: pages
# Builds the wheel and publishes the in-browser demo: the detectors run
# in the visitor's browser through Pyodide, nothing leaves the page.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A deployment is never cut off halfway; the next one waits its turn.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build
      - run: python -m build --wheel
      - name: Assemble the site
        run: |
          mkdir -p _site/wheels _site/samples
          cp demo/index.html _site/index.html
          cp dist/*.whl _site/wheels/
          cp corpus/sample/*.json _site/samples/
          ls _site/wheels/*.whl | xargs -n1 basename > _site/wheels/latest.txt
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
