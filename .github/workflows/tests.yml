name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pydantic click jiwer pytest
      - run: PYTHONPATH=src python -m pytest tests/ -v
      - run: PYTHONPATH=src python -m trusted_transcription.cli detect corpus/sample/silence_hallucination.json --format table
      - run: PYTHONPATH=src python -m trusted_transcription.cli detect corpus/sample/clean_transcript.json --format table
      - run: PYTHONPATH=src python -m trusted_transcription.cli cost 60
