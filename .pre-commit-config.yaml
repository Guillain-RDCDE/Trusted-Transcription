# pip install pre-commit && pre-commit install
# The ruff rev is the same pin as in pyproject.toml's dev extra and in CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: check-toml
      - id: check-yaml
      # corpus/ is generated (transcribe.py, report.py, fetch.py) and the
      # sample hashes are recorded: kept byte-exact as the scripts write it.
      - id: end-of-file-fixer
        exclude: ^corpus/
      - id: trailing-whitespace
        exclude: ^corpus/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
      - id: ruff-format
