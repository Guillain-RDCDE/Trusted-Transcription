[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trusted-transcription"
version = "0.9.2"
description = "Catch confident lies in automatic transcription — hallucination detection, LLM repair, and quality scoring for production ASR pipelines."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Guillain d'Erceville", email = "guillain@poulpe.us" },
]
keywords = ["whisper", "asr", "hallucination", "transcription", "quality", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "jiwer>=3.0",
]

[project.optional-dependencies]
# Engines and the repair model. Everything else — detectors, guards,
# prevention, bench — runs without an API client.
api = ["openai>=1.0", "anthropic>=0.30"]
local = ["faster-whisper>=1.0"]
mcp = ["mcp>=1.0"]
eval = ["pandas>=2.0", "tabulate>=0.9"]
dev = ["pytest>=8.0", "ruff==0.16.8", "mypy>=1.10", "build>=1.0"]
all = ["trusted-transcription[api,local,mcp,eval,dev]"]

[project.scripts]
tt = "trusted_transcription.cli:main"
tt-mcp = "trusted_transcription.mcp_server:main"
tt-bench = "trusted_transcription.eval_runner:main"

[project.urls]
Repository = "https://github.com/Guillain-RDCDE/Trusted-Transcription"
Changelog = "https://github.com/Guillain-RDCDE/Trusted-Transcription/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/trusted_transcription"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "corpus/sample/", "docs/", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
