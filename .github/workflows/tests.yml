name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pydantic click jiwer pytest
      - run: PYTHONPATH=src python -m pytest tests/ -v
      - run: PYTHONPATH=src python -m trusted_transcription.cli detect corpus/sample/silence_hallucination.json --format table
      - run: PYTHONPATH=src python -m trusted_transcription.cli detect corpus/sample/clean_transcript.json --format table
      - run: PYTHONPATH=src python -m trusted_transcription.cli detect corpus/sample/prompt_echo.json --format table
      - run: PYTHONPATH=src python -m trusted_transcription.cli windows corpus/sample/forced_cuts.json --format table
      - run: PYTHONPATH=src python -m trusted_transcription.cli detect corpus/sample/script_drift.json --format table
      - run: PYTHONPATH=src python -m trusted_transcription.cli spell corpus/sample/spellings.json
      - run: PYTHONPATH=src python -m trusted_transcription.cli chunks 3468.636 --bitrate 320
      - run: PYTHONPATH=src python -m trusted_transcription.cli bench-report corpus/sample/bench_results.jsonl --control paid-api
      - run: PYTHONPATH=src python -m trusted_transcription.cli cost 60
