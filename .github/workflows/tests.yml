name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The publish workflow runs this whole file first and uploads nothing
  # unless every job here passes.
  workflow_call:
permissions:
  contents: read
concurrency:
  # A literal prefix, not github.workflow: when publish.yml calls this file,
  # github.workflow is the caller's name and the two groups would collide.
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Pinned on purpose: an unpinned linter is a weather report, not a gate.
      - run: pip install -e . ruff==0.16.10 mypy==2.4.0
      - run: ruff check src/ tests/ corpus/
      - run: ruff format --check src/ tests/ corpus/
      # Strict mode and its scope live in pyproject.toml.
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e . pytest==9.1.1 pytest-cov==7.1.0
      - run: python -m pytest tests/ -v --cov=trusted_transcription --cov-report=term-missing:skip-covered
      - run: tt detect corpus/sample/silence_hallucination.json --format table
      - run: tt detect corpus/sample/clean_transcript.json --format table
      - run: tt detect corpus/sample/prompt_echo.json --format table
      - run: tt detect corpus/sample/script_drift.json --format table
      - run: tt windows corpus/sample/forced_cuts.json --format table
      - run: tt spell corpus/sample/spellings.json
      - run: tt chunks 3468.636 --bitrate 320
      - run: tt bench-report corpus/sample/bench_results.jsonl --control paid-api
      - run: tt cost 60
      - run: tt eval corpus/sample

  package:
    # The wheel installs in a clean environment with nothing but the
    # three declared dependencies, and the commands exist.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build
      - run: python -m build
      - run: pip install dist/*.whl
      - run: cd / && tt --help && tt-mcp --help && tt-bench --help
      - run: cd / && tt cost 60
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docker:
    # The image carries the commands and nothing else, and runs them
    # on a mounted sample.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t tt .
      - run: docker run --rm tt cost 60
      - run: docker run --rm -v "$PWD/corpus/sample:/data" tt detect /data/silence_hallucination.json --format table
      - run: docker run --rm -v "$PWD/corpus/sample:/data" tt spell /data/spellings.json
