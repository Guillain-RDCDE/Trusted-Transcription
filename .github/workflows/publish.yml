name: publish
# Publishes the package to PyPI when a version tag is pushed.
# Requires a trusted publisher on PyPI for this repository and
# workflow, and a GitHub environment named "pypi" — see
# docs/RELEASING.md. No token is stored anywhere.
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Tag and package version must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$tag" = "$version" || { echo "tag $tag != version $version"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
