name: pages
# Builds the wheel and publishes the in-browser demo: the detectors run
# in the visitor's browser through Pyodide, nothing leaves the page.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - name: Assemble the site
        run: |
          mkdir -p _site/wheels _site/samples
          cp demo/index.html _site/index.html
          cp dist/*.whl _site/wheels/
          cp corpus/sample/*.json _site/samples/
          ls _site/wheels/*.whl | xargs -n1 basename > _site/wheels/latest.txt
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
